<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Comparação de contraste</title>
  <desc id="desc">Dois cartões com o mesmo texto. O primeiro tem baixo contraste e o segundo apresenta alto contraste e melhor legibilidade.</desc>
  <rect width="1200" height="700" fill="#f7f8fb"/>
  <text x="600" y="105" text-anchor="middle" font-family="Arial" font-size="52" font-weight="700" fill="#1d2a3a">Contraste faz diferença</text>
  <rect x="110" y="175" width="440" height="360" rx="36" fill="#d8dde6"/>
  <text x="330" y="270" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#b0b5bd">Baixo contraste</text>
  <text x="330" y="350" text-anchor="middle" font-family="Arial" font-size="30" fill="#b4b9c0">Texto difícil de ler</text>
  <rect x="650" y="175" width="440" height="360" rx="36" fill="#15283e"/>
  <text x="870" y="270" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#ffffff">Bom contraste</text>
  <text x="870" y="350" text-anchor="middle" font-family="Arial" font-size="30" fill="#ffffff">Texto claro e legível</text>
  <circle cx="870" cy="430" r="45" fill="#ffcc66"/>
  <path d="M846 430 l18 18 36-42" fill="none" stroke="#14283f" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
